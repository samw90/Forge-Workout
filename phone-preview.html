<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FORGE — iPhone 14 Pro Max Preview</title>
<style>
  html,body{ margin:0; height:100%; background:#2a2a2e; font-family:-apple-system,BlinkMacSystemFont,sans-serif; overflow:hidden; }
  .stage{ height:100%; display:flex; align-items:center; justify-content:center; }
  /* 430×932 screen + 14px bezel */
  .phone{
    position:relative; width:458px; height:960px; flex-shrink:0;
    background:#111; border-radius:68px; transform-origin:center;
    box-shadow:0 0 0 2px #3a3a3e, 0 0 0 5px #1c1c1e, 0 30px 80px rgba(0,0,0,.55);
  }
  .btn{ position:absolute; background:#1c1c1e; border-radius:2px; width:5px; }
  .btn.l1{ left:-7px; top:170px; height:34px; }
  .btn.l2{ left:-7px; top:235px; height:64px; }
  .btn.l3{ left:-7px; top:315px; height:64px; }
  .btn.r1{ right:-7px; top:260px; height:100px; }
  .screen{
    position:absolute; inset:14px; border-radius:55px; overflow:hidden; background:#F7F5F0;
    display:flex; flex-direction:column;
  }
  /* Home-screen web-app mode: status bar sits above the page */
  .status{ height:54px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 34px 0 48px; font-size:17px; font-weight:600; color:#1A1A1A; }
  .icons{ display:flex; gap:6px; align-items:center; }
  .island{ position:absolute; top:11px; left:50%; transform:translateX(-50%); width:126px; height:37px; background:#000; border-radius:20px; z-index:3; }
  iframe{ flex:1; width:100%; border:0; display:block; }
  .home{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:150px; height:5px; border-radius:3px; background:#1A1A1A; z-index:3; pointer-events:none; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="btn l1"></div><div class="btn l2"></div><div class="btn l3"></div><div class="btn r1"></div>
    <div class="screen">
      <div class="island"></div>
      <div class="status">
        <span id="clock">9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1A1A1A"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#1A1A1A"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#1A1A1A"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1A1A1A"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 00-4.8 0zM3.6 6.3a6.6 6.6 0 018.8 0l1.5-1.8a9 9 0 00-11.8 0zM.2 2.6a11.6 11.6 0 0115.6 0" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#1A1A1A" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#1A1A1A"/><path d="M25 4.5v4a2 2 0 000-4z" fill="#1A1A1A" opacity=".4"/></svg>
        </span>
      </div>
      <iframe id="app" title="FORGE app"></iframe>
      <div class="home"></div>
    </div>
  </div>
</div>
<script>
  // Scale the phone to fit the window
  const fit=()=>{ const s=Math.min(1,(innerHeight-40)/960,(innerWidth-40)/458); document.getElementById('phone').style.transform='scale('+s+')'; };
  addEventListener('resize',fit); fit();
  // Cache-bust so edits to index.html always show on reload
  document.getElementById('app').src='index.html?v='+Date.now();
</script>
</body>
</html>
