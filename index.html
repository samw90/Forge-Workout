<title>FORGE — Training System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{ --body:'DM Sans',sans-serif; --mono:'IBM Plex Mono',monospace; --disp:'Syne',sans-serif; }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#F7F5F0; overscroll-behavior-y:none; font-family:var(--body); }
  #root{ min-height:100vh; }
  button{ outline:none; touch-action:manipulation; }
  input{ outline:none; }
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  ::-webkit-scrollbar{ height:0; width:0; }
  /* LOG SET button doubles as the rest timer */
  @keyframes throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
  @keyframes readyPop{ 0%{ transform:scale(1); box-shadow:0 0 0 0 rgba(45,122,79,.55); } 35%{ transform:scale(1.05); } 100%{ transform:scale(1); box-shadow:0 0 0 18px rgba(45,122,79,0); } }
  .throb{ animation:throb .9s ease-in-out infinite; }
  .ready{ animation:readyPop .7s ease-out 2; }
  /* Swipe-to-step number fields */
  @keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.06); } 100%{ transform:scale(1); } }
  .bump{ animation:bump .16s ease-out; }
</style>

// ═══ 1RM + PROGRESSION ═══
// Bodyweight (or band) movements progress by reps; everything else by load
const isBWEx = def => { const eq=def.eq||[]; return eq.includes('bodyweight')||(eq.length>0&&eq.every(e=>e==='band')); };

function epley(w,r){ return r===1?w:w*(1+r/30); }
function brzycki(w,r){ return r>=37?w:w/(1.0278-0.0278*r); }
function est1RM(w,r){ return (epley(w,r)+brzycki(w,r))/2; }
const round25 = v => Math.round(v/2.5)*2.5;

function getProgression(exId, exDef, history){
  if(!history||!history.length) return null;
  const sessions = history.map(w=>{
    const e=(w.exercises||[]).find(x=>x.id===exId);
    return e&&e.loggedSets&&e.loggedSets.length?{date:w.date,sets:e.loggedSets}:null;
  }).filter(Boolean);
  if(!sessions.length) return null;
  const last = sessions[sessions.length-1];
  const targetReps = exDef.reps, repMax = exDef.repMax||targetReps+3;
  const inc = exDef.inc==null?5:exDef.inc;
  const setsNeeded = exDef.pSets||exDef.sets;
  const isBW = isBWEx(exDef);
  const daysSince = Math.floor((Date.now()-new Date(last.date).getTime())/86400000);
  const longGap = daysSince>21;

  if(isBW){
    const totalSets=last.sets.length;
    const setsAtUpper = last.sets.filter(s=>s.reps>=repMax).length;
    const setsOnTarget = last.sets.filter(s=>s.reps>=targetReps).length;
    const bestReps = Math.max.apply(null,last.sets.map(s=>s.reps||0));
    let status,advice,citation,nextReps;
    if(setsAtUpper===totalSets&&totalSets>=setsNeeded){status='ADD_LOAD';nextReps=repMax;advice='All sets at '+repMax+'+ reps — add external load (weight vest / plate)';citation='Plotkin et al. 2022 · ACSM 2009';}
    else if(setsOnTarget>=Math.ceil(totalSets*0.75)){status='REP_PROG';nextReps=Math.min(repMax,bestReps+1);advice='Push toward '+repMax+' reps per set before adding load';citation='Plotkin et al. 2022';}
    else{status='REP_HOLD';nextReps=targetReps;advice="Match last session's reps — build consistency first";citation='Zourdos et al. 2016';}
    if(longGap&&(status==='ADD_LOAD'||status==='REP_PROG')){
      status='REP_HOLD';nextReps=Math.min(bestReps,repMax);
      advice=daysSince+' days since last session — match previous reps before pushing on';citation='Zourdos et al. 2016';
    }
    const recentBest = sessions.slice(-3).map(s=>Math.max.apply(null,s.sets.map(x=>x.reps||0)));
    let trend='FIRST SESSION';
    if(recentBest.length>=2){const d=recentBest[recentBest.length-1]-recentBest[0];trend=d>0?'IMPROVING':d===0?'STALLING':'PLATEAU';}
    else if(sessions.length===1)trend='BASELINE';
    return {isBodyweight:true,status,advice,citation,nextReps,nextWeight:null,est1RM:null,trend,sessions:sessions.length};
  }

  // ── loaded ──
  // Ignore sessions with no real load recorded (e.g. weight left at 0) — they'd suggest 0 lbs
  const loadedSessions=sessions.filter(x=>x.sets.some(y=>y.weight>0));
  if(!loadedSessions.length) return null;
  if(loadedSessions.length!==sessions.length) return getProgression(exId,exDef,history.filter(w=>{const e=(w.exercises||[]).find(x=>x.id===exId); return !e||!e.loggedSets||!e.loggedSets.length||e.loggedSets.some(y=>y.weight>0);}));
  // Round to increments that exist for the implement (dumbbells come in 5s)
  const rnd = v => { const step=(exDef.eq||[]).includes('dumbbell')?5:2.5; return Math.round(v/step)*step; };
  const topWOf = s => Math.max.apply(null,s.sets.map(x=>x.weight||0));
  const topRepsOf = s => { const tw=topWOf(s); return Math.max.apply(null,s.sets.filter(x=>(x.weight||0)===tw).map(x=>x.reps||0)); };
  const bestRMOf = s => { const v=s.sets.filter(x=>x.weight>0&&x.reps>0).map(x=>est1RM(x.weight,x.reps)); return v.length?Math.max.apply(null,v):null; };

  // Anchor everything to the top working weight; ramp-up and back-off sets don't
  // dilute the verdict — only sets performed at that weight count as work sets.
  const topWeight = topWOf(last);
  const workSets = last.sets.filter(s=>(s.weight||0)===topWeight);
  const totalWork = workSets.length;
  const enough = totalWork>=Math.max(2,setsNeeded-1)||totalWork===last.sets.length;
  const setsAtUpper = workSets.filter(s=>s.reps>=repMax).length;
  const setsOnTarget = workSets.filter(s=>s.reps>=targetReps).length;
  const bestLastReps = Math.max.apply(null,workSets.map(s=>s.reps||0));

  let nextWeight,nextReps,status,advice,citation;
  if(setsAtUpper===totalWork&&enough){nextWeight=rnd(topWeight+inc);nextReps=targetReps;status='PROGRESS';advice='All working sets ≥'+repMax+' reps — ready to add '+(nextWeight-topWeight)+' lbs';citation='Plotkin et al. 2022 · ACSM 2009';}
  else if(setsOnTarget>=Math.ceil(totalWork*0.75)){nextWeight=topWeight;nextReps=Math.min(repMax,bestLastReps+1);status='HOLD';advice='Accumulate reps toward '+repMax+' before adding load';citation='Plotkin et al. 2022';}
  else if(setsOnTarget>=Math.ceil(totalWork*0.50)){nextWeight=topWeight;nextReps=bestLastReps;status='HOLD';advice="Building rep consistency — match last session's reps";citation='Zourdos et al. 2016';}
  else{nextWeight=rnd(Math.max(topWeight-Math.max(inc,topWeight*0.10),0));nextReps=targetReps;status='DELOAD';advice='Reps fell short — reduce ~10% to restore quality';citation='Helms et al. 2018 · Kraemer & Ratamess 2004';}

  // RPE autoregulation: reps alone don't show how close to failure the sets were
  const rpes=workSets.map(x=>x.rpe).filter(Boolean);
  const avgR=rpes.length>=Math.ceil(totalWork/2)?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  if(avgR!=null){
    if(status==='PROGRESS'&&avgR>=9.5){ status='HOLD'; nextWeight=topWeight; nextReps=Math.min(repMax,bestLastReps); advice='Reps hit, but at RPE '+avgR.toFixed(1)+' — own this weight one more session'; citation='Helms et al. 2016 · RPE autoregulation'; }

  }
  // Stall: 3 straight sessions at the same top weight with no top-set rep gain
  if(status==='HOLD'&&sessions.length>=3){
    const r3=sessions.slice(-3);
    if(r3.every(s=>topWOf(s)===topWeight)&&topRepsOf(r3[2])<=topRepsOf(r3[0])){
      status='STALLED';
      nextWeight=rnd(Math.max(topWeight*0.9,0)); nextReps=targetReps;
      advice='3 sessions stuck at '+topWeight+' lbs — deload ~10% or swap in a variation';
      citation='Helms et al. 2018 · Kraemer & Ratamess 2004';
    }
  }
  // Long layoff: re-establish rather than progress
  if(longGap&&status==='PROGRESS'){
    status='HOLD'; nextWeight=daysSince>42?rnd(topWeight*0.9):topWeight; nextReps=targetReps;
    advice=daysSince+' days since last session — re-establish at '+(daysSince>42?'~90% of ':'')+'your last working weight';
    citation='Kraemer & Ratamess 2004';
  }

  // Trend from best-set e1RM per session — far less noisy than averaging all sets
  const recentRMs = sessions.slice(-3).map(bestRMOf).filter(x=>x!=null);
  const lastBest = bestRMOf(last);
  let trend='FIRST SESSION';
  if(recentRMs.length>=2){const pct=((recentRMs[recentRMs.length-1]-recentRMs[0])/recentRMs[0])*100;trend=pct>2?'IMPROVING':pct>0?'STALLING':'PLATEAU';}
  else if(sessions.length===1)trend='BASELINE';
  return {isBodyweight:false,nextWeight,nextReps,status,advice,citation,est1RM:lastBest!=null?Math.round(lastBest):null,trend,sessions:sessions.length};
}

// Per-session series for an exercise: best-set est. 1RM (loaded) or best reps (bodyweight)
function seriesPts(exId,history){
  const def=getExDef({id:exId}), isBW=isBWEx(def);
  return (history||[]).map(w=>{
    const s=(w.exercises||[]).find(e=>e.id===exId);
    if(!s||!s.loggedSets||!s.loggedSets.length)return null;
    let v;
    if(isBW) v=Math.max.apply(null,s.loggedSets.map(x=>x.reps||0));
    else { const ss=s.loggedSets.filter(x=>x.weight>0&&x.reps>0); v=ss.length?Math.max.apply(null,ss.map(x=>est1RM(x.weight,x.reps))):null; }
    return {t:new Date(w.date).getTime(),v};
  }).filter(p=>p&&p.v!=null&&isFinite(p.v));
}
function getSeries(exId,history){ return seriesPts(exId,history).map(p=>p.v); }
function sparkline(vals,color,w,h2){
  if(!vals||vals.length<2)return null;
  w=w||110; h2=h2||26; const pad=3;
  const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), rng=(max-min)||1;
  const pts=vals.map((v,i)=>(pad+i*(w-2*pad)/(vals.length-1)).toFixed(1)+','+(h2-pad-(v-min)/rng*(h2-2*pad)).toFixed(1));
  const last=pts[pts.length-1].split(',');
  return h('div',{style:'line-height:0',html:`<svg width="${w}" height="${h2}" viewBox="0 0 ${w} ${h2}"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`});
}

const SM={PROGRESS:{color:T.acc,icon:'↑',label:'PROGRESS'},HOLD:{color:T.warn,icon:'→',label:'HOLD'},DELOAD:{color:T.bad,icon:'↓',label:'REDUCE'},STALLED:{color:T.bad,icon:'↻',label:'STALLED'},ADD_LOAD:{color:T.acc,icon:'↑',label:'ADD LOAD'},REP_PROG:{color:T.warn,icon:'→',label:'ADD REPS'},REP_HOLD:{color:T.mut,icon:'→',label:'BUILD REPS'}};
const TM={IMPROVING:{color:T.ok},STALLING:{color:T.warn},PLATEAU:{color:T.bad},'FIRST SESSION':{color:T.mut},BASELINE:{color:T.mut}};

// ═══ GENERATION ═══
const pickOne = a => a.length?a[Math.floor(Math.random()*a.length)]:null;
function pickN(a,n){const c=a.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o;}
const hasEq=(ex,eq)=>ex.eq.length===0||ex.eq.every(e=>eq.includes(e));
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fmtDate=d=>new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

// Estimated time cost of an exercise in seconds: ~45s of work per set,
// rest between sets (not after the last), plus ~60s setup/transition.
// Long rests are discounted — in practice they get cut short (4min → ~3min),
// so rest beyond 90s only counts at 60%.
const effRest = r => r<=90 ? r : 90 + (r-90)*0.6;
// ── Session order ──
// Each exercise loads a set of resources: its muscles (primary 1, synergist ½) plus two
// common limiters — grip and lower back. Ordering puts Olympic lifts, then heavy compounds,
// first and arm isolation last; in between it picks whichever move's resources are freshest,
// so nothing that needs a muscle comes right after something that fried it.
// 3 = limiting (heavy pulls, hanging, cleans), 2 = sustained, 1 = light; unlisted = none.
const GRIP={deadlift:3,sumo_dl:3,rdl:3,pwr_clean:3,hng_clean:3,c_jerk:3,pullup:3,chinup:3,hammer_curl:3,
  db_rdl:2,sl_rdl:2,bb_row:2,db_row:2,incl_db_row:2,cbl_row:2,pulldown:2,inv_row:2,door_row:2,
  lunge:2,step_up:2,bulg_split:2,bb_curl:2,db_curl:2,preacher:2,cbl_curl:2};
const LOWBACK={deadlift:3,rdl:3,good_morn:3,sumo_dl:2,bb_row:2,bk_squat:2,box_squat:2,pwr_clean:2,hng_clean:2,c_jerk:2,db_rdl:2,
  fr_squat:1,sl_rdl:1,pull_thru:1,push_press:1,ohp:1,inv_row:1};
const gripOf=e=>GRIP[e.id]||0;
const isArmIso=e=>e.type==='accessory'&&(e.tags||[]).some(t=>t==='biceps'||t==='triceps')&&!(e.tags||[]).some(t=>t==='chest'||t==='back');
function loadOf(e){
  const L={}; const add=(k,v)=>{ if(v>0) L[k]=Math.max(L[k]||0,v); };
  musclesOf(e).forEach(m=>add(m,1)); secondaryOf(e).forEach(m=>add(m,0.5));
  add('grip',gripOf(e)/3); add('lowback',(LOWBACK[e.id]||0)/3);
  return L;
}
// Cost of running `seq` in order, starting from fatigue `start`: overlap with still-tired
// resources, taxing grip/lower back ahead of a later lift that depends on it more, and
// a mild push to get compounds done earlier.
function seqCost(seq,start){
  const f=Object.assign({},start), Ls=seq.map(loadOf); let c=0;
  seq.forEach((e,i)=>{
    const L=Ls[i];
    for(const r in L) c+=(f[r]||0)*L[r];
    ['grip','lowback'].forEach(r=>{ if(!L[r])return; const need=Math.max.apply(null,Ls.slice(i+1).map(x=>x[r]||0).concat(0)); if(need>L[r]) c+=2*L[r]*(need-L[r]); });
    if(e.type==='compound') c+=0.3*i;
    for(const r in f) f[r]*=0.5;                  // partial recovery per exercise
    for(const r in L) f[r]=(f[r]||0)+L[r];
  });
  return {cost:c,fatigue:f};
}
function orderSession(sel){
  // Blocks are fixed: power first, heavy compounds while fresh, isolation arms last.
  // Within a block, start heaviest-first, then swap pairs while the session cost drops.
  const block=e=>e.type==='olympic'?0:e.type==='compound'&&e.rest>=180?1:isArmIso(e)?3:2;
  let fatigue={}; const out=[];
  [0,1,2,3].forEach(b=>{
    let seq=sel.filter(e=>block(e)===b).sort((x,y)=>y.rest-x.rest);
    if(!seq.length) return;
    let best=seqCost(seq,fatigue).cost, improved=true;
    for(let it=0;improved&&it<60;it++){
      improved=false;
      for(let i=0;i<seq.length;i++) for(let j=i+1;j<seq.length;j++){
        const t=seq.slice(); [t[i],t[j]]=[t[j],t[i]];
        const c=seqCost(t,fatigue).cost;
        if(c<best-1e-9){ best=c; seq=t; improved=true; }
      }
    }
    fatigue=seqCost(seq,fatigue).fatigue;
    out.push.apply(out,seq);
  });
  return out;
}

const exCost = ex => ex.sets*45 + Math.max(0,ex.sets-1)*effRest(ex.rest) + 60;

function genWorkout(dur,target,equip){
  equip=equip.filter(x=>x!=='none_fixture');
  const budget=dur*60, MAX_EX=9;
  const all=DB.filter(e=>hasEq(e,equip));
  const sel=[]; let used=0;
  // Reserve headroom so early expensive picks always leave room for a 3-exercise minimum
  const CHEAP=315; // typical accessory cost
  const fits=e=>used+exCost(e)<=budget-Math.max(0,2-sel.length)*CHEAP;
  // Coverage-aware preference: within a slot, favor candidates that hit a sub-muscle
  // not yet in the session, and deprioritize near-duplicates (identical tag sets).
  // Still random within the preferred tier; falls back to the full pool once covered.
  const subT=e=>e.tags.slice(1);
  const sameTags=(a,b)=>a.tags.length===b.tags.length&&a.tags.every(t=>b.tags.includes(t));
  const prefer=cand=>{
    if(cand.length<2)return cand;
    const cov=new Set(); sel.forEach(s=>subT(s).forEach(t=>cov.add(t)));
    const noDup=cand.filter(e=>!sel.some(s=>sameTags(e,s)));
    const t1=noDup.filter(e=>subT(e).some(t=>!cov.has(t)));
    if(t1.length)return t1;
    if(noDup.length)return noDup;
    // Everything duplicates something — spread repeats across the least-represented tag set
    const cnt=e=>sel.filter(s=>sameTags(e,s)).length;
    const min=Math.min.apply(null,cand.map(cnt));
    return cand.filter(e=>cnt(e)===min);
  };
  // add one exercise from src; force=true falls back to the cheapest option if nothing fits
  const add=(src,force)=>{
    const fresh=src.filter(e=>!sel.find(s=>s.id===e.id));
    let cand=prefer(fresh.filter(fits));
    if(!cand.length&&force&&fresh.length){
      const min=Math.min.apply(null,fresh.map(exCost));
      cand=fresh.filter(e=>exCost(e)===min);
    }
    const p=pickOne(cand);
    if(p){sel.push(p);used+=exCost(p);return true;}
    return false;
  };
  if(target==='gaps') return genGaps(dur,equip,all);
  if(target==='today') return genToday(dur,equip,all);
  if(target==='recovery'){
    const pool=all.filter(e=>e.type==='recovery');
    for(let i=0;i<20&&sel.length<MAX_EX;i++){ if(!add(pool,sel.length<3)) break; }
    return toWkt(sel,dur,target,equip);
  }
  const pool=all.filter(e=>e.type!=='recovery'&&(target==='full'||e.muscles.some(m=>m===target||m==='full')));
  if(target==='upper'){
    add(pool.filter(e=>e.type==='compound'&&e.tags.includes('push')),true);
    add(pool.filter(e=>e.type==='compound'&&e.tags.includes('pull')));
    for(let i=0,miss=0;i<20&&miss<2&&sel.length<MAX_EX;i++){
      if(add(pool.filter(e=>e.type==='accessory'&&e.tags.includes(i%2===0?'pull':'push'))))miss=0;else miss++;
    }
  } else if(target==='lower'){
    if(dur>=45) add(pool.filter(e=>e.type==='olympic'&&e.muscles.includes('lower')));
    add(pool.filter(e=>e.tags.includes('squat')&&e.type==='compound'),sel.length===0);
    add(pool.filter(e=>e.tags.includes('hinge')&&(e.type==='compound'||e.type==='olympic')));
    for(let i=0;i<14&&sel.length<MAX_EX;i++){ if(!add(pool.filter(e=>e.type==='accessory'))) break; }
  } else {
    add(pool.filter(e=>e.type==='olympic'),true);
    ['squat','hinge','push','pull'].forEach(tag=>{ if(sel.length<MAX_EX) add(pool.filter(e=>e.tags.includes(tag)&&e.type==='compound')); });
    for(let i=0;i<14&&sel.length<MAX_EX;i++){ if(!add(pool.filter(e=>e.type==='accessory'))) break; }
  }
  for(let i=0;sel.length<3&&i<20;i++) add(pool,true);
  return toWkt(orderSession(sel),dur,target,equip);
}
// What the Gaps target should train: the muscles furthest below the weekly set target
// (last 4 weeks, or all time if that's empty) plus any push/pull imbalance to correct.
function gapFocus(){
  if(!state.saved.length) return null;
  let r=buildReport(28); if(!r.win.length) r=buildReport(0);
  const need={}; r.muscles.forEach(m=>need[m.id]=Math.max(0,SET_TARGET-m.weekly));
  let focus=r.muscles.filter(m=>m.weekly<5);
  if(focus.length<2) focus=r.muscles.filter(m=>m.weekly<SET_TARGET);
  focus=focus.sort((a,b)=>a.weekly-b.weekly).slice(0,4);
  const ratio=r.pat.push+r.pat.pull>=6?r.pat.push/Math.max(r.pat.pull,1):1;
  return {muscles:focus.map(m=>m.id),labels:focus.map(m=>m.label),need,
    bias:ratio>1.5?'pull':(r.pat.push>0&&ratio<0.67)?'push':null};
}
const gapCredit=(e,m)=>musclesOf(e).includes(m)?1:secondaryOf(e).includes(m)?0.5:0;
// Build a session from muscle weights. `w` = muscles to prioritise (weight = how much),
// `w2` = broader weights used to fill leftover time, `avoid` = muscles to leave alone,
// `bias` = 'push'|'pull' to favour, `oly` = open with one Olympic lift.
function genWeighted(dur,equip,all,o){
  const budget=dur*60, MAX_EX=9, CHEAP=315, avoid=o.avoid||[];
  const focus=Object.keys(o.w).filter(m=>o.w[m]>0);
  const need={}; focus.forEach(m=>need[m]=o.w[m]);
  const ok=e=>e.type!=='recovery'&&!avoid.some(m=>musclesOf(e).includes(m));
  // Olympic lifts are skill work — only as a deliberate opener, never to patch a muscle
  const pool=all.filter(e=>ok(e)&&e.type!=='olympic'&&focus.some(m=>gapCredit(e,m)>0));
  const sameTags=(a,b)=>a.tags.length===b.tags.length&&a.tags.every(t=>b.tags.includes(t));
  const sel=[]; let used=0;
  if(o.oly){
    const p=pickOne(all.filter(e=>ok(e)&&e.type==='olympic'&&exCost(e)<=budget*0.35));
    if(p){ sel.push(p); used+=exCost(p); }
  }
  // Weighted by remaining need; each pick halves that muscle's need so the session spreads out
  const score=e=>{
    let v=0; focus.forEach(m=>v+=gapCredit(e,m)*need[m]);
    if(o.bias&&e.tags.includes(o.bias)) v*=1.3;
    if(e.type==='compound') v*=1.1;
    if(sel.some(x=>sameTags(x,e))) v*=0.5;
    return v;
  };
  while(sel.length<MAX_EX){
    const fits=e=>used+exCost(e)<=budget-Math.max(0,2-sel.length)*CHEAP;
    const cand=pool.filter(e=>!sel.includes(e)&&fits(e)).map(e=>({e,v:score(e)})).filter(x=>x.v>0);
    if(!cand.length) break;
    const best=Math.max.apply(null,cand.map(x=>x.v));
    const p=pickOne(cand.filter(x=>x.v>=best*0.85)).e;
    sel.push(p); used+=exCost(p);
    focus.forEach(m=>{ const c=gapCredit(p,m); if(c) need[m]*=c===1?0.5:0.75; });
  }
  for(let i=0;sel.length<3&&i<5;i++){
    const rest=pool.filter(e=>!sel.includes(e)); if(!rest.length) break;
    const min=Math.min.apply(null,rest.map(exCost)), p=pickOne(rest.filter(e=>exCost(e)===min));
    sel.push(p); used+=exCost(p);
  }
  // Fill the requested time: extra sets on priority exercises first, then moves for the
  // broader weights, then top up sets anywhere.
  const MAX_SETS=5, extra=new Map(), setCost=e=>45+effRest(e.rest);
  const prio=e=>focus.reduce((a,m)=>a+gapCredit(e,m)*o.w[m],0);
  const bump=(list,rounds)=>{ for(let r=0;r<rounds;r++) list.forEach(e=>{
    const x=extra.get(e)||0;
    if(x===r&&e.sets+x<MAX_SETS&&used+setCost(e)<=budget){ extra.set(e,x+1); used+=setCost(e); }
  }); };
  bump(sel.filter(e=>prio(e)>0).sort((a,b)=>prio(b)-prio(a)),2);
  const pool2=all.filter(e=>ok(e)&&e.type!=='olympic');
  while(sel.length<MAX_EX){
    const cand=pool2.filter(e=>!sel.includes(e)&&used+exCost(e)<=budget)
      .map(e=>({e,v:MUSCLES.reduce((a,[m])=>a+gapCredit(e,m)*(o.w2[m]||0),0)*(sel.some(x=>sameTags(x,e))?0.5:1)}))
      .filter(x=>x.v>0);
    if(!cand.length) break;
    const best=Math.max.apply(null,cand.map(x=>x.v));
    const p=pickOne(cand.filter(x=>x.v>=best*0.85)).e;
    sel.push(p); used+=exCost(p);
  }
  bump(sel.slice().sort((a,b)=>prio(b)-prio(a)),3);
  const up=sel.some(e=>e.muscles.includes('upper')), low=sel.some(e=>e.muscles.includes('lower'));
  return {
    exercises:orderSession(sel.map(e=>extra.get(e)?Object.assign({},e,{sets:e.sets+extra.get(e)}):e)),
    warm:up&&low?'full':low?'lower':'upper',   // which warmup/cooldown fits this session
  };
}
function genGaps(dur,equip,all){
  const g=gapFocus();
  if(!g||!g.muscles.length) return toWkt([],dur,'gaps',equip);
  const w={}; g.muscles.forEach(m=>w[m]=Math.max(1,g.need[m]));
  const r=genWeighted(dur,equip,all,{w,w2:g.need,bias:g.bias});
  const wk=toWkt(r.exercises,dur,'gaps',equip);
  wk.config.muscles=g.muscles; wk.config.focus=g.labels; wk.config.warm=r.warm;
  return wk;
}

// ═══ TODAY (auto coach) ═══
// Effort per set: RPE 6 (easy) … 10 (max). Unrated sets count as ~RPE 8.5.
const RPE_FACTOR={6:0.6,7:0.75,8:0.9,9:1.05,10:1.2};
const rpeFactor=r=>r?(RPE_FACTOR[Math.round(r)]||1):1;
const UPPER_M=['chest','back','shoulders','biceps','triceps'], LOWER_M=['quads','hamstrings','glutes'];
const RECOVERY_H=36, FATIGUE_FULL=8;   // fatigue halves-ish every ~day; 8 hard sets ≈ not ready

// Decide today's session from recovery (sets × effort, decaying over ~36h), this month's
// weekly volume gaps, how long since each muscle was trained, and recent effort (RPE).
function planToday(){
  const now=Date.now(), hist=state.saved, has=hist.length>0;
  let rep=has?buildReport(28):null; if(rep&&!rep.win.length) rep=buildReport(0);
  const fat={}, last={}; MUSCLES.forEach(([m])=>fat[m]=0);
  hist.forEach(w=>{
    const t=new Date(w.date).getTime()+(w.elapsed||0)*1000, hrs=(now-t)/3600000;
    if(!(hrs>=0)) return;
    const decay=Math.exp(-hrs/RECOVERY_H);
    (w.exercises||[]).forEach(e=>{
      const def=getExDef(e), sets=e.loggedSets||[];
      if(!sets.length||def.type==='recovery') return;
      const eff=sets.reduce((a,s)=>a+rpeFactor(s.rpe),0);
      musclesOf(def).forEach(m=>{ fat[m]+=eff*decay; last[m]=Math.max(last[m]||0,t); });
      secondaryOf(def).forEach(m=>fat[m]+=eff*0.5*decay);
    });
  });
  const M={};
  MUSCLES.forEach(([id,label])=>{
    const ready=Math.max(0,Math.min(1,1-fat[id]/FATIGUE_FULL));
    const mm=rep&&rep.muscles.find(x=>x.id===id), weekly=mm?mm.weekly:0;
    const need=has?Math.max(0,Math.min(1,(SET_TARGET-weekly)/SET_TARGET)):0.5;
    const days=last[id]?(now-last[id])/DAY:null;
    const stale=days==null?(has?0.5:0):Math.min(1,days/7)*0.5;
    M[id]={id,label,ready,need,days,pri:ready*(0.3+need+stale)};
  });
  const avg=ids=>ids.reduce((a,id)=>a+M[id].pri,0)/ids.length;
  const minReady=ids=>Math.min.apply(null,ids.map(id=>M[id].ready));
  const U=avg(UPPER_M), L=avg(LOWER_M);
  const region=U>1.25*L?'upper':L>1.25*U?'lower':'full';
  const ids=region==='upper'?UPPER_M:region==='lower'?LOWER_M:UPPER_M.concat(LOWER_M);
  let avoid=ids.filter(id=>M[id].ready<0.5);
  let live=ids.filter(id=>!avoid.includes(id));
  if(!live.length){ live=ids; avoid=[]; }
  const w={}, w2={};
  live.forEach(id=>w2[id]=M[id].pri);
  const focus=live.slice().sort((a,b)=>M[b].pri-M[a].pri).slice(0,4);
  focus.forEach(id=>w[id]=Math.max(0.05,M[id].pri));

  // Recent effort: last 3 sessions averaging RPE 9+ → lighter day
  const rpes=hist.slice(-3).flatMap(x=>(x.exercises||[]).flatMap(e=>(e.loggedSets||[]).map(s=>s.rpe).filter(Boolean)));
  const avgRpe=rpes.length>=6?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  const deload=avgRpe!=null&&avgRpe>=9;
  // Open with an Olympic lift if you've been doing them and the posterior chain is fresh
  const olyLately=!!rep&&rep.win.some(x=>(x.exercises||[]).some(e=>getExDef(e).type==='olympic'&&(e.loggedSets||[]).length));
  const oly=region!=='upper'&&olyLately&&['hamstrings','glutes','back'].every(id=>M[id].ready>=0.7);
  const ratio=rep&&rep.pat.push+rep.pat.pull>=6?rep.pat.push/Math.max(rep.pat.pull,1):1;
  const bias=region==='lower'?null:ratio>1.5?'pull':(rep&&rep.pat.push>0&&ratio<0.67)?'push':null;

  const pct=v=>Math.round(v*100)+'%';
  const why=[];
  if(!has) why.push('No history yet — balanced full-body start');
  else{
    if(region==='upper') why.push(minReady(LOWER_M)<0.8?'Legs still recovering ('+pct(minReady(LOWER_M))+' ready)':'Upper body is further behind this month');
    else if(region==='lower'){
      const d=Math.min.apply(null,LOWER_M.map(id=>M[id].days==null?99:M[id].days));
      why.push(minReady(UPPER_M)<0.8?'Upper body still recovering ('+pct(minReady(UPPER_M))+' ready)':d>=4?'Legs last trained '+Math.round(d)+' days ago':'Lower body is further behind this month');
    }
    else why.push(minReady(ids)>=0.8?'Everything is recovered — full body':'Upper and lower are about even');
    why.push('Focus: '+focus.slice(0,3).map(id=>M[id].label.toLowerCase()).join(', '));
    if(avoid.length) why.push('Resting '+avoid.map(id=>M[id].label.toLowerCase()).join(', ')+' — trained hard recently');
    if(deload) why.push('Lighter day: recent sets averaged RPE '+avgRpe.toFixed(1)+' — weights at ~90%');
    if(oly) why.push('Opening with an Olympic lift — posterior chain is fresh');
    if(bias) why.push('Leaning '+bias+' to balance push/pull');
  }
  return {region,w,w2,avoid,bias,oly,deload,why,focus:focus.map(id=>M[id].label),muscles:focus.concat(live.filter(id=>!focus.includes(id))),M};
}

}

function h(tag, attrs, children){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='style') el.style.cssText=attrs[k];
    else if(k==='class') el.className=attrs[k];
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==='html') el.innerHTML=attrs[k];
    else if(attrs[k]!=null&&attrs[k]!==false) el.setAttribute(k,attrs[k]);
  }
  if(children!=null){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false) return;
      el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
    });
  }
  return el;
}

// ═══ WARMUP / COOLDOWN ═══
function WarmCool(phase){
  const target=state.wkt?(state.wkt.config.warm||state.wkt.config.target):state.cfg.target;
  const steps=(COOLDOWNS[target]||COOLDOWNS.upper);
  if(state.wc.phase!==phase){ state.wc={phase,idx:0,secs:steps[0].dur,paused:false,endAt:Date.now()+steps[0].dur*1000}; }
  // Like the rest timer, remaining time comes from endAt so a locked screen doesn't stall it
  const setStep=i=>{ state.wc.idx=i; state.wc.secs=steps[i].dur; state.wc.endAt=Date.now()+steps[i].dur*1000; };
  const togglePause=()=>{
    if(state.wc.paused){ state.wc.endAt=Date.now()+state.wc.secs*1000; state.wc.paused=false; }
    else { state.wc.secs=Math.max(0,Math.ceil((state.wc.endAt-Date.now())/1000)); state.wc.paused=true; }
    render();
  };
  const wc=state.wc, step=steps[wc.idx];
  const accent=T.ok;
  const totalDur=steps.reduce((a,s)=>a+s.dur,0);
  const elapsed=steps.slice(0,wc.idx).reduce((a,s)=>a+s.dur,0)+(step.dur-wc.secs);

  if(wcInterval) clearInterval(wcInterval);
  wcInterval=setInterval(()=>{
    if(state.screen!==phase){clearInterval(wcInterval);return;}
    if(state.wc.paused) return;
    const s=Math.max(0,Math.ceil((state.wc.endAt-Date.now())/1000));
    if(s<=0){
      if(state.wc.idx<steps.length-1){ setStep(state.wc.idx+1); render(); }
      else { state.wc.secs=0; updateWCTimer(steps,accent); clearInterval(wcInterval); }
      return;
    }
    if(s!==state.wc.secs){ state.wc.secs=s; updateWCTimer(steps,accent); }
  },250);

  const wrap=h('div',{style:`min-height:100vh;background:${T.bg};color:${T.txt};font-family:var(--body);display:flex;flex-direction:column`});
  wrap.appendChild(h('div',{style:`background:${T.sf};border-bottom:1px solid ${T.bdr};padding:14px 20px;display:flex;justify-content:space-between;align-items:center`},[
    h('div',null,[
      h('div',{style:`font-family:var(--disp);font-size:26px;letter-spacing:2px;color:${accent};font-weight:700`},'COOL DOWN'),
      h('div',{style:`font-size:10px;color:${T.mut};letter-spacing:2px;margin-top:2px`},Math.round(totalDur/60)+' MIN · NOT COUNTED IN WORKOUT TIME'),
    ]),
    h('button',{style:`background:${T.el};border:1px solid ${T.bdr};color:${T.mut};padding:9px 16px;border-radius:10px;cursor:pointer;font-family:var(--body);font-size:12px`,onClick:()=>finishWC(phase)},'SKIP ALL'),
  ]));
  // progress
  wrap.appendChild(h('div',{style:`height:3px;background:${T.bdr}`},h('div',{id:'wc-prog',style:`height:100%;background:${accent};width:${(elapsed/totalDur)*100}%;transition:width 1s linear`})));
  // dots

  let x0=null,y0=null,dragging=false,held=false,timer=null,val=s.rpe||null;
  const at=x=>{ const r=row.getBoundingClientRect(); return snapRpe((x-r.left)/r.width); };
  const show=v=>{
    val=v; wt.style.color=T.txt;
    fill.style.width=rpeWidth(v)+'%'; fill.style.background=rpeBright(v);
    right.textContent=v+' · '+RPE_TEXT[v]; right.style.color=T.txt; right.style.fontWeight='600';
  };
  const commit=()=>{ s.rpe=val; persistActive(); setTimeout(render,dragging?0:220); };  // brief bright flash on tap
  const stop=()=>{ clearTimeout(timer); x0=null; };
  row.addEventListener('pointerdown',e=>{
    x0=e.clientX; y0=e.clientY; dragging=false; held=false;
    clearTimeout(timer);
    timer=setTimeout(()=>{ held=true; x0=null; state.editSet={i,w:String(s.weight),r:String(s.reps),rpe:s.rpe||null}; render(); },HOLD_MS);
  });
  row.addEventListener('pointermove',e=>{
    if(x0==null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0;
    if(!dragging){
      if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
      clearTimeout(timer);
      if(Math.abs(dy)>Math.abs(dx)){ stop(); return; }          // vertical = list scroll
      dragging=true; try{ row.setPointerCapture(e.pointerId); }catch(_){}
    }
    show(at(e.clientX));
  });
  row.addEventListener('pointerup',e=>{
    if(x0==null||held){ stop(); return; }
    clearTimeout(timer);
    if(!dragging) show(at(e.clientX));
    x0=null; commit();
  });
  row.addEventListener('pointercancel',()=>{ const d=dragging; stop(); dragging=false; if(d) render(); });
  row.addEventListener('contextmenu',e=>e.preventDefault());
  return row;
}

const BAR=45, PLATES=[45,35,25,10,5,2.5];
function platesPerSide(w){
  let side=(w-BAR)/2; if(side<=0) return 'empty bar';
  const out=[]; PLATES.forEach(p=>{ while(side>=p-1e-9){ out.push(p); side-=p; } });
  return out.join(' + ')+' / side';
}
// Warm-up ramp for the FIRST movement only (it replaces the general warm-up screen).
// Barbell: empty bar → 50% → 70% → 85%; dumbbell/cable: 50% → 75%; bodyweight: one easy half-rep set.
function warmupSets(wkt,idx,work){
  if(idx!==0) return [];
  const ex=wkt.exercises[0], def=getExDef(ex);
  if(def.type==='recovery') return [];
  if(isBWEx(def)) return [{w:0,r:Math.max(3,Math.ceil((ex.pReps||def.reps||8)/2))}];
  if(!(work>0)) return [];
  const bar=(def.eq||[]).includes('barbell'), oly=def.type==='olympic';
  const plan=bar?[[0,oly?5:10],[0.5,oly?3:5],[0.7,oly?2:3],[0.85,1]]:[[0.5,8],[0.75,3]];   // 0 = empty bar
  const gap=bar?20:5, out=[];
  plan.forEach(([p,r])=>{
    const w=p===0?BAR:Math.max(bar?BAR:5,Math.round(work*p/5)*5);
    const prev=out.length?out[out.length-1].w:0;
    if(w<work&&(!out.length||w>=prev+gap)) out.push({w,r});
  });
  return out;
}

// Swipe up/down on a number field to step it (weight ±5, reps ±1); a tap with no drag
// opens the number pad. Once the field is focused it behaves like a normal input.
function swipeNumber(inp,step,key){
  const STEP_PX=22, TAP_PX=8;
  let y0=null, base=0, moved=false;
  const box=h('div',{style:'position:relative'},[
    inp,
    h('span',{style:`position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;line-height:1;color:${T.mut};opacity:.55;pointer-events:none`},'▲'),
    h('span',{style:`position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px;line-height:1;color:${T.mut};opacity:.55;pointer-events:none`},'▼'),
  ]);
  inp.style.touchAction='none';
  const set=v=>{
    v=Math.max(0,Math.round(v*100)/100);
    if(String(v)===state[key]) return;
    state[key]=String(v); inp.value=state[key];
    inp.classList.remove('bump'); void inp.offsetWidth; inp.classList.add('bump');
  };
  // Block the native tap-to-focus; we decide on release whether it was a tap or a swipe
  inp.addEventListener('touchstart',e=>{ if(document.activeElement!==inp) e.preventDefault(); },{passive:false});
  inp.addEventListener('pointerdown',e=>{
    if(document.activeElement===inp) return;
    e.preventDefault(); y0=e.clientY; base=parseFloat(state[key])||0; moved=false;
    try{ inp.setPointerCapture(e.pointerId); }catch(_){}
  });
  inp.addEventListener('pointermove',e=>{
    if(y0==null) return;
    const dy=y0-e.clientY;
    if(!moved&&Math.abs(dy)<TAP_PX) return;
    if(!moved){ moved=true; inp.style.borderColor=T.acc; }
    // first step after a short flick, then one step per STEP_PX of travel
    const steps=Math.sign(dy)*Math.floor((Math.abs(dy)+STEP_PX/2)/STEP_PX);
    set(base+steps*step);
  });
  const release=()=>{
    if(y0==null) return;
    y0=null; inp.style.borderColor=T.bdr;
    if(!moved){ inp.focus(); try{ inp.select(); }catch(_){} }
    else render();                          // refresh "Next: N reps" etc.
  };
  inp.addEventListener('pointerup',release);
  inp.addEventListener('pointercancel',()=>{ y0=null; inp.style.borderColor=T.bdr; });
  return box;
}

// Swap the current exercise for an equipment-valid alternative with the same
// role: same primary movement pattern + tier first, then progressively looser.
function swapExercise(){
  const wkt=state.wkt, ex=wkt.exercises[state.exIdx];
  if(!wkt||ex.loggedSets.length)return;
  const def=getExDef(ex);
  const equip=(wkt.config.equip||state.cfg.equip).filter(x=>x!=='none_fixture');
  const target=wkt.config.target;
  const all=DB.filter(e=>hasEq(e,equip)&&e.id!==ex.id&&!wkt.exercises.find(s=>s.id===e.id));
  let pool;
  if(target==='recovery'){ pool=all.filter(e=>e.type==='recovery'); }
  else if(target==='gaps'||target==='today'){
    // Same gap muscle as the current exercise first, then any gap muscle
    const ms=wkt.config.muscles||[], base=all.filter(e=>e.type!=='recovery'&&e.type!=='olympic'), mine=musclesOf(def).filter(m=>ms.includes(m));
    pool=base.filter(e=>musclesOf(e).some(m=>mine.includes(m)));
    if(!pool.length)pool=base.filter(e=>ms.some(m=>gapCredit(e,m)>0));
    // Never swap to something off-target — say so instead
    if(!pool.length){ state.logErr='No other gap exercises available with this equipment'; render(); return; }
  }
  else{
    const base=all.filter(e=>e.type!=='recovery'&&(target==='full'||e.muscles.some(m=>m===target||m==='full')));
    const tag=def.tags[0];
    pool=base.filter(e=>e.type===def.type&&e.tags.includes(tag));
    if(!pool.length)pool=base.filter(e=>e.tags.includes(tag));
    if(!pool.length)pool=base.filter(e=>e.type===def.type);
    if(!pool.length)pool=base;
  }
  // Prefer a replacement that complements the rest of the session:
  // uncovered sub-muscle first, then non-duplicate tag sets, then anything.
  if(pool.length>1){
    const others=wkt.exercises.filter((_,i)=>i!==state.exIdx);
    const cov=new Set(); others.forEach(s=>(s.tags||[]).slice(1).forEach(t=>cov.add(t)));
    const dup=(a,b)=>a.tags.length===b.tags.length&&a.tags.every(t=>b.tags.includes(t));
    const noDup=pool.filter(e=>!others.some(s=>dup(e,s)));
    const t1=noDup.filter(e=>e.tags.slice(1).some(t=>!cov.has(t)));
    pool=t1.length?t1:(noDup.length?noDup:pool);
  }
  const p=pickOne(pool);
  if(!p)return;
  wkt.exercises[state.exIdx]=Object.assign({},p,{pSets:p.sets,pReps:p.reps,loggedSets:[]});
  navTo(state.exIdx);
  render();
}

function logSet(){
  primeAudio(); // user gesture — unlock audio for the rest-complete cue
  const ex=state.wkt.exercises[state.exIdx];
  const loggedReps=parseInt(state.rIn)||0, loggedW=parseFloat(state.wIn)||0;
  const err=setError(loggedW,loggedReps,isBWEx(getExDef(ex)));
  if(err){ state.logErr=err; render(); return; }
  state.editSet=null;
  ex.loggedSets.push({weight:loggedW,reps:loggedReps,ts:Date.now()});
  startRest(ex.rest);
  const def2=getExDef(ex), tgt=def2.reps||ex.pReps, rMax=def2.repMax||tgt+3;
  if(loggedReps>=rMax) state.rIn=String(rMax);
  else if(loggedReps>=tgt) state.rIn=String(Math.min(rMax,loggedReps+1));
  else state.rIn=String(loggedReps);
  persistActive();
  render();
}

// ── Rest-complete cue: vibration (Android) + short beep (needs gesture-primed AudioContext) ──
let audioCtx=null;
function primeAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function restCue(){
  try{ if(navigator.vibrate) navigator.vibrate([200,120,200]); }catch(e){}
  try{
    if(!audioCtx||audioCtx.state!=='running')return;
    const beep=(t,f)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.start(t); o.stop(t+0.3);
    };
    const now=audioCtx.currentTime;
    beep(now,880); beep(now+0.35,880); beep(now+0.7,1174.66);
  }catch(e){}
}

// Timestamp-based: survives iOS timer throttling / screen lock.
// The interval only repaints — remaining time is always computed from endAt.
function startRest(sec){
  state.timer={on:true,s:sec,total:sec,endAt:Date.now()+sec*1000};
  if(restInterval)clearInterval(restInterval);
  restInterval=setInterval(tickRest,250);
}
function tickRest(){
  if(!state.timer.on){clearInterval(restInterval);return;}
  const s=Math.max(0,Math.ceil((state.timer.endAt-Date.now())/1000));
  if(s<=0){
    state.timer={on:false,s:0,total:0,ready:true};   // LOG SET turns green until the next set
    clearInterval(restInterval);
    restCue();
    render();
    return;
  }
  if(s!==state.timer.s){
    state.timer.s=s;
    const se=document.getElementById('rest-secs'); if(se)se.textContent=fmtT(s);
    const fill=document.getElementById('rest-fill'); if(fill)fill.style.width=(s/state.timer.total*100)+'%';
    const btn=document.getElementById('log-btn'); if(btn&&s<=REST_THROB)btn.classList.add('throb');
  }
}
function saveWorkout(){
  if(!state.wkt)return;
  if(tickInterval)clearInterval(tickInterval);
  if(restInterval)clearInterval(restInterval);
  state.timer={on:false,s:0,total:0};
  const done=Object.assign({},state.wkt,{endTime:Date.now(),elapsed:state.elapsed});
  state.saved=state.saved.concat([done]); persist();
  clearActive();
  state.startT=0; state.elapsed=0; state.endPrompt=null; state.editSet=null;

    inner.appendChild(h('div',{style:'padding:16px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center',onClick:()=>{if(state.histOpen!=null){state.histOpen=null;render();return;}state.histExp=isExp?null:i;render();}},[

    if(isExp){

            h('div',{style:'display:flex;align-items:center;gap:10px'},[
              (function(){const s=getSeries(ex.id,state.saved);return s.length>=2?sparkline(s.slice(-8),T.acc,70,20):null;})(),
              best?h('div',{style:`font-family:var(--mono);font-size:11px;color:${T.mut}`},'~'+best+' 1RM'):null,
            ]),
          ]),
          h('div',{style:'display:flex;flex-wrap:wrap;gap:6px'},ex.loggedSets.length?ex.loggedSets.map(s=>h('div',{style:`background:${s.rpe?rpeSoft(s.rpe):T.el};border-radius:6px;padding:4px 10px;font-size:12px;font-family:var(--mono);color:${T.ok}`},(s.weight>0?s.weight+'×'+s.reps:'BW×'+s.reps)+(s.rpe?' @'+s.rpe:''))):[h('span',{style:`font-size:12px;color:${T.mut}`},'No sets logged')]),
        ]));
      });
      det.appendChild(h('div',{style:`margin-top:8px;padding-top:12px;border-top:1px solid ${T.bdr};display:flex;gap:20px`},[
        statBox('SETS',totalSets),statBox('VOLUME',totalVol.toLocaleString()+' lbs'),statBox('DURATION',fmtT(w.elapsed||0)),
      ]));
      inner.appendChild(det);
    }

    // swipe container
    const container=h('div',{style:'position:relative;margin-bottom:10px;border-radius:12px;overflow:hidden'});
    container.appendChild(h('div',{style:`position:absolute;right:0;top:0;bottom:0;width:82px;background:${T.tmr};display:flex;align-items:center;justify-content:center;border-radius:0 12px 12px 0`},
      h('button',{style:'background:none;border:none;cursor:pointer;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:5px',onClick:(e)=>{e.stopPropagation();deleteWorkout(state.saved.length-1-i);},html:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+T.bg+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg><span style="font-size:10px;font-weight:700;color:'+T.bg+';letter-spacing:.5px;font-family:var(--body)">DELETE</span>'})
    ));
    container.appendChild(inner);
    attachSwipe(container,inner,rowId);
    body.appendChild(container);
  });
  wrap.appendChild(body);
  return wrap;
}

// ═══ PROGRESS REPORT ═══
const MUSCLES=[['chest','Chest'],['back','Back'],['shoulders','Shoulders'],['biceps','Biceps'],['triceps','Triceps'],['quads','Quads'],['hamstrings','Hamstrings'],['glutes','Glutes']];
// Olympic lifts have no muscle tags — credit the prime movers
const OLY_MUSCLES={pwr_clean:['hamstrings','glutes','back'],hng_clean:['hamstrings','glutes','back'],c_jerk:['quads','glutes','shoulders']};
const musclesOf=def=>OLY_MUSCLES[def.id]||(def.tags||[]).filter(t=>MUSCLES.some(m=>m[0]===t));
// Synergists get half a set (fractional volume): presses → triceps/delts, rows → biceps, squats/hinges → glutes
function secondaryOf(def){
  const tg=def.tags||[], prim=musclesOf(def), out=[];
  if(tg.includes('push')&&tg.includes('chest')) out.push('triceps','shoulders');
  if(tg.includes('pull')&&tg.includes('back')) out.push('biceps');
  if(tg.includes('squat')||tg.includes('hinge')) out.push('glutes');
  return out.filter(m=>!prim.includes(m));
}
const DAY=86400000, SET_TARGET=10, SESSION_TARGET=3;
const grade=v=>v>=.9?'A':v>=.8?'B':v>=.7?'C':v>=.6?'D':'F';
const gradeColor=g=>g==='A'||g==='B'?T.ok:g==='C'?T.warn:T.bad;

// days=0 → all time
function buildReport(days){
  const now=Date.now(), tOf=w=>new Date(w.date).getTime();
  const all=state.saved.slice().sort((a,b)=>tOf(a)-tOf(b));
  const firstT=all.length?tOf(all[0]):now;
  const from=days?now-days*DAY:firstT;
  const win=all.filter(w=>tOf(w)>=from);
  const prev=days?all.filter(w=>tOf(w)>=from-days*DAY&&tOf(w)<from):[];
  // Don't penalise a history that's younger than the window
  const weeks=Math.max(7,(now-Math.max(from,firstT))/DAY)/7;

  const totals=ws=>{
    let sets=0,vol=0,time=0;
    ws.forEach(w=>{ time+=w.elapsed||0; (w.exercises||[]).forEach(e=>{ const bw=isBWEx(getExDef(e)); (e.loggedSets||[]).forEach(s=>{ sets++; if(!bw)vol+=(s.weight||0)*(s.reps||0); }); }); });
    return {sessions:ws.length,sets,vol:Math.round(vol),avgMin:ws.length?Math.round(time/ws.length/60):0};
  };
  const cur=totals(win), before=totals(prev);

  // Weekly working sets per muscle + movement-pattern balance (recovery work excluded)
  const mSets={}; MUSCLES.forEach(m=>mSets[m[0]]=0);
  const pat={push:0,pull:0,squat:0,hinge:0};
  const names={};
  win.forEach(w=>(w.exercises||[]).forEach(e=>{
    const def=getExDef(e), n=(e.loggedSets||[]).length;
    names[e.id]=e.name||def.name||e.id;
    if(!n||def.type==='recovery')return;
    musclesOf(def).forEach(m=>mSets[m]+=n);
    secondaryOf(def).forEach(m=>mSets[m]+=n*0.5);
    Object.keys(pat).forEach(k=>{ if((def.tags||[]).includes(k))pat[k]+=n; });
  }));
  const muscles=MUSCLES.map(([id,label])=>({id,label,weekly:mSets[id]/weeks}));

  // Per-lift trend inside the window, PRs vs. everything before it, sessions since last best
  const ids=[...new Set(win.flatMap(w=>(w.exercises||[]).filter(e=>(e.loggedSets||[]).length&&getExDef(e).type!=='recovery').map(e=>e.id)))];
  const lifts=ids.map(id=>{
    const def=getExDef({id}), pts=seriesPts(id,all), inW=pts.filter(p=>p.t>=from);
    if(!inW.length)return null;
    const priorVals=pts.filter(p=>p.t<from).map(p=>p.v);
    const priorBest=priorVals.length?Math.max.apply(null,priorVals):null;
    const first=inW[0].v, last=inW[inW.length-1].v, best=Math.max.apply(null,inW.map(p=>p.v));
    let bi=0; pts.forEach((p,i)=>{ if(p.v>pts[bi].v)bi=i; });
    return {id,name:names[id]||def.name||id,isBW:isBWEx(def),n:inW.length,first,last,
      pct:first?(last-first)/first*100:0, pr:priorBest!=null&&best>priorBest,
      sinceBest:pts.length-1-bi, total:pts.length, series:inW.map(p=>p.v)};
  }).filter(Boolean);

  const tracked=lifts.filter(l=>l.n>=2);
  // Plateau = no new all-time best in 3+ sessions. A lift climbing back toward an old best
  // is "rebuilding": half credit, listed with plateaus rather than as a gain.
  const isPlateau=l=>l.total>=3&&l.sinceBest>=3;
  lifts.forEach(l=>{ l.rebuilding=isPlateau(l)&&l.n>=2&&l.pct>1; });
  const up=tracked.filter(l=>l.pct>1&&!isPlateau(l)), flat=tracked.filter(l=>!up.includes(l)&&l.pct>=-1);
  const gains=up.slice().sort((a,b)=>b.pct-a.pct).slice(0,5);
  const plateaus=lifts.filter(isPlateau).sort((a,b)=>(a.rebuilding-b.rebuilding)||(b.sinceBest-a.sinceBest)).slice(0,5);
  const regressions=tracked.filter(l=>l.pct<-5&&!plateaus.includes(l)).sort((a,b)=>a.pct-b.pct).slice(0,3);
  const prs=lifts.filter(l=>l.pr);

  const perWeek=cur.sessions/weeks;
  const scores={
    consistency:win.length?Math.min(1,perWeek/SESSION_TARGET):0,
    progression:tracked.length?(up.length+flat.length*0.5)/tracked.length:null,
    coverage:muscles.reduce((a,m)=>a+Math.min(1,m.weekly/SET_TARGET),0)/muscles.length,
  };
  const avail=Object.values(scores).filter(v=>v!=null);
  const overall=win.length?avail.reduce((a,b)=>a+b,0)/avail.length:null;

  // Gaps
  const gaps=[];
  muscles.filter(m=>m.weekly===0).forEach(m=>gaps.push({sev:'bad',text:'No direct '+m.label.toLowerCase()+' work'}));
  muscles.filter(m=>m.weekly>0&&m.weekly<5).forEach(m=>gaps.push({sev:'warn',text:m.label+' is low — '+m.weekly.toFixed(1)+' sets/wk'}));
  if(pat.push+pat.pull>=6){
    const r=pat.push/Math.max(pat.pull,1);
    if(r>1.5) gaps.push({sev:'warn',text:'Pushing '+r.toFixed(1)+'× more than pulling — add rows or pull-ups for shoulder health'});
    else if(pat.push>0&&r<0.67) gaps.push({sev:'warn',text:'Pulling '+(pat.pull/pat.push).toFixed(1)+'× more than pushing'});
  }
  const stale=[];
  const regionOf=c=>c.target==='gaps'||c.target==='today'?(c.warm||'full'):c.target;
  const lastOf=tg=>{ const w=all.filter(x=>x.config&&(regionOf(x.config)===tg||regionOf(x.config)==='full')).pop(); return w?Math.floor((now-tOf(w))/DAY):null; };
  [['upper','Upper body'],['lower','Lower body']].forEach(([tg,label])=>{
    const d=lastOf(tg);
    if(d==null) gaps.push({sev:'bad',text:label+' never trained'});
    else if(d>10){ gaps.push({sev:'warn',text:label+' last trained '+d+' days ago'}); stale.push([label,d]); }
  });

  // Focus next — the most useful 3 things to act on
  const focus=[];
  if(win.length&&perWeek<SESSION_TARGET*0.67) focus.push('Get to '+SESSION_TARGET+' sessions a week — you’re averaging '+perWeek.toFixed(1)+'. Frequency is the biggest lever right now.');
  if(stale[0]) focus.push(stale[0][0]+' hasn’t been trained in '+stale[0][1]+' days — make your next session '+stale[0][0].toLowerCase().replace(' body','')+'.');
  const weakest=muscles.slice().sort((a,b)=>a.weekly-b.weekly)[0];
  if(weakest&&weakest.weekly<5) focus.push('Bring up '+weakest.label.toLowerCase()+': aim for ~'+SET_TARGET+' sets a week (currently '+(weakest.weekly?weakest.weekly.toFixed(1):'none')+').');
  const stuck=plateaus.find(l=>!l.rebuilding);
  if(stuck) focus.push(stuck.name+': no new best in '+stuck.sinceBest+' sessions — deload ~10% for a week or swap in a variation.');
  if(regressions[0]&&focus.length<3) focus.push(regressions[0].name+' is down '+Math.abs(regressions[0].pct).toFixed(0)+'% — check sleep, recovery and rest times.');
  if(!focus.length&&win.length) focus.push('Everything’s trending the right way — keep the plan and keep logging.');

  return {days,win,cur,before,weeks,perWeek,muscles,pat,lifts,tracked,up,flat,gains,plateaus,regressions,prs,scores,overall,gaps,focus:focus.slice(0,3)};
}

function Report(){
  const r=buildReport(state.reportDays);
  const wrap=h('div',{style:`min-height:100vh;background:${T.bg};color:${T.txt};font-family:var(--body);padding-bottom:40px`});
  wrap.appendChild(h('div',{style:`background:${T.sf};border-bottom:1px solid ${T.bdr};padding:16px 20px;display:flex;align-items:center;gap:14px`},[
    h('button',{style:`flex-shrink:0;white-space:nowrap;background:${T.el};border:1px solid ${T.bdr};color:${T.txt};padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--body);font-size:13px`,onClick:()=>go('setup')},'← Back'),
    h('div',{style:`font-family:var(--disp);font-size:min(24px,calc((100vw - 160px) / 11.5));letter-spacing:.5px;color:${T.acc};font-weight:700;white-space:nowrap`},'PROGRESS REPORT'),
  ]));
  const body=h('div',{style:'padding:20px;max-width:480px;margin:0 auto;box-sizing:border-box'});
  wrap.appendChild(body);

  // Range
  body.appendChild(h('div',{style:'display:flex;gap:8px;margin-bottom:18px'},[[28,'4 WEEKS'],[84,'12 WEEKS'],[0,'ALL TIME']].map(([d,l])=>{
    const on=state.reportDays===d;
    return h('button',{style:`flex:1;padding:9px 0;border-radius:24px;cursor:pointer;border:1px solid ${on?T.acc:T.bdr};background:${on?T.acc+'14':T.sf};color:${on?T.acc:T.mut};font-family:var(--body);font-size:12px;letter-spacing:1px;font-weight:${on?600:400}`,onClick:()=>{state.reportDays=d;render();}},l);
  })));

  if(!r.win.length){
    body.appendChild(h('div',{style:`text-align:center;color:${T.mut};padding:60px 0`},[
      h('div',{style:'font-size:44px;margin-bottom:14px'},'📋'),
      h('div',{style:`font-size:16px;color:${T.txt};margin-bottom:6px`},state.saved.length?'No workouts in this period':'No workouts yet'),
      h('div',{style:'font-size:13px'},'Log a few sessions and your report card fills in here.'),
    ]));
    return wrap;
  }

  const card=(title,sub,children)=>h('div',{style:`background:${T.sf};border:1px solid ${T.bdr};border-radius:14px;padding:16px 18px;margin-bottom:14px`},[
    h('div',{style:`display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px`},[
      h('div',{style:`font-size:10px;letter-spacing:2.5px;color:${T.mut};font-weight:600`},title),
      sub?h('div',{style:`font-size:10px;color:${T.mut}`},sub):null,
    ]),
  ].concat(children));
  const pill=(txt,color)=>h('span',{style:`background:${color}1c;color:${color};font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap`},txt);
  const fmtV=(l,v)=>l.isBW?Math.round(v)+' reps':Math.round(v)+' lbs';
  // Loaded lifts are compared by best-set est. 1RM — say so, it isn't the bar weight
  const fmtRange=l=>(l.isBW?'':'est. 1RM ')+fmtV(l,l.first)+' → '+fmtV(l,l.last);

  // ── Report card ──
  const og=grade(r.overall);
  const subj=(label,score,detail)=>{
    const g=score==null?'—':grade(score), col=score==null?T.mut:gradeColor(g);
    return h('div',{style:'margin-bottom:12px'},[
      h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:5px'},[
        h('span',{style:`font-size:11px;letter-spacing:1.5px;font-weight:600`},label),
        h('span',{style:`font-family:var(--disp);font-size:18px;font-weight:800;color:${col}`},g),
      ]),
      h('div',{style:`height:5px;background:${T.el};border-radius:3px;overflow:hidden`},h('div',{style:`height:100%;width:${Math.round((score||0)*100)}%;background:${col};border-radius:3px`})),
      h('div',{style:`font-size:11px;color:${T.mut};margin-top:4px`},detail),
    ]);
  };
  body.appendChild(h('div',{style:`background:${T.sf};border:1px solid ${T.bdr};border-radius:14px;padding:18px;margin-bottom:14px;display:flex;gap:18px`},[
    h('div',{style:`flex-shrink:0;width:96px;text-align:center;border-right:1px solid ${T.bdr};padding-right:16px`},[
      h('div',{style:`font-size:10px;letter-spacing:2px;color:${T.mut};margin-bottom:6px`},'OVERALL'),
      h('div',{style:`font-family:var(--disp);font-size:72px;line-height:1;font-weight:800;color:${gradeColor(og)}`},og),
      h('div',{style:`font-size:11px;color:${T.mut};margin-top:8px`},Math.round(r.overall*100)+' / 100'),
    ]),
    h('div',{style:'flex:1;min-width:0'},[
      subj('CONSISTENCY',r.scores.consistency,r.perWeek.toFixed(1)+' sessions/wk · goal '+SESSION_TARGET),
      subj('PROGRESSION',r.scores.progression,r.tracked.length?r.up.length+' of '+r.tracked.length+' lifts trending up':'Repeat a lift to start tracking'),
      subj('COVERAGE',r.scores.coverage,r.muscles.filter(m=>m.weekly>=SET_TARGET).length+' of '+r.muscles.length+' muscles at '+SET_TARGET+'+ sets/wk'),
    ]),
  ]));

  // ── Headline stats vs previous period ──
  const delta=(a,b)=>{ if(!r.days||!b)return null; const p=Math.round((a-b)/b*100); return h('div',{style:`font-size:10px;font-family:var(--mono);margin-top:2px;color:${p>0?T.ok:p<0?T.bad:T.mut}`},(p>0?'▲ ':p<0?'▼ ':'')+Math.abs(p)+'%'); };
  const stat=(label,val,d)=>h('div',{style:'flex:1;min-width:0'},[
    h('div',{style:`font-size:9px;letter-spacing:1.5px;color:${T.mut};margin-bottom:3px`},label),
    h('div',{style:`font-family:var(--mono);font-size:15px;font-weight:600`},val), d,
  ]);
  const volK=v=>v>=10000?(v/1000).toFixed(v>=100000?0:1)+'k':v.toLocaleString();
  body.appendChild(h('div',{style:`background:${T.sf};border:1px solid ${T.bdr};border-radius:14px;padding:14px 18px;margin-bottom:14px`},[
    h('div',{style:'display:flex;gap:10px'},[
      stat('SESSIONS',r.cur.sessions,delta(r.cur.sessions,r.before.sessions)),
      stat('SETS',r.cur.sets,delta(r.cur.sets,r.before.sets)),
      stat('VOLUME',volK(r.cur.vol),delta(r.cur.vol,r.before.vol)),
      stat('AVG TIME',r.cur.avgMin+'m',null),
    ]),
    r.days&&r.before.sessions?h('div',{style:`font-size:10px;color:${T.mut};margin-top:10px`},'Change vs. the previous '+(r.days/7)+' weeks'):null,
  ]));

  // ── Gains ──
  body.appendChild(card('GAINS',r.prs.length?r.prs.length+' new PR'+(r.prs.length>1?'s':''):'best-set est. 1RM',
    r.gains.length?r.gains.map(l=>h('div',{style:`display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid ${T.el}`},[
      h('div',{style:'flex:1;min-width:0'},[
        h('div',{style:'font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px'},[h('span',{style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},l.name),l.pr?pill('PR',T.acc):null]),
        h('div',{style:`font-size:11px;color:${T.mut};font-family:var(--mono);margin-top:2px`},fmtRange(l)),
      ]),
      sparkline(l.series.slice(-8),T.ok,60,20),
      pill('+'+l.pct.toFixed(l.pct<10?1:0)+'%',T.ok),
    ])):[h('div',{style:`font-size:12px;color:${T.mut}`},r.tracked.length?'No lifts trending up yet this period.':'Log the same lift in 2+ sessions to see gains.')]));

  // ── Plateaus & regressions ──
  const stuck=r.plateaus.map(l=>h('div',{style:`display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid ${T.el}`},[
    h('div',{style:'flex:1;min-width:0'},[
      h('div',{style:'font-size:13px;font-weight:500'},l.name),
      h('div',{style:`font-size:11px;color:${T.mut};margin-top:2px`},l.rebuilding
        ?'Climbing back (+'+l.pct.toFixed(0)+'% this period) · no new best in '+l.sinceBest+' sessions'
        :'No new best in '+l.sinceBest+' sessions · '+(l.isBW?'best ':'est. 1RM ')+fmtV(l,Math.max.apply(null,l.series))),
    ]),
    pill(l.rebuilding?'REBUILDING':'STUCK',T.warn),
  ])).concat(r.regressions.map(l=>h('div',{style:`display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid ${T.el}`},[
    h('div',{style:'flex:1;min-width:0'},[
      h('div',{style:'font-size:13px;font-weight:500'},l.name),
      h('div',{style:`font-size:11px;color:${T.mut};font-family:var(--mono);margin-top:2px`},fmtRange(l)),
    ]),
    pill(l.pct.toFixed(0)+'%',T.bad),
  ])));
  body.appendChild(card('PLATEAUS','3+ sessions without a new best',stuck.length?stuck:[h('div',{style:`font-size:12px;color:${T.mut}`},'Nothing stuck — every tracked lift has set a best recently.')]));

  // ── Muscle coverage ──
  const maxW=Math.max(SET_TARGET*1.5,...r.muscles.map(m=>m.weekly));
  body.appendChild(card('MUSCLE COVERAGE','working sets / week · target '+SET_TARGET+'+',r.muscles.map(m=>{
    const col=m.weekly>=SET_TARGET?T.ok:m.weekly>0?T.warn:T.bad;
    return h('div',{style:'display:flex;align-items:center;gap:10px;margin-bottom:8px'},[
      h('div',{style:'width:78px;font-size:12px;flex-shrink:0'},m.label),
      h('div',{style:`flex:1;height:8px;background:${T.el};border-radius:4px;position:relative`},[
        h('div',{style:`height:100%;width:${Math.min(100,m.weekly/maxW*100)}%;background:${col};border-radius:4px`}),
        h('div',{style:`position:absolute;top:-3px;bottom:-3px;left:${SET_TARGET/maxW*100}%;width:2px;background:${T.txt};opacity:.25`}),
      ]),
      h('div',{style:`width:34px;text-align:right;font-family:var(--mono);font-size:12px;color:${col}`},m.weekly.toFixed(m.weekly<10&&m.weekly>0?1:0)),
    ]);
  }).concat([h('div',{style:`font-size:9px;color:${T.mut}88;font-style:italic;margin-top:6px`},'Compound lifts credit synergists at ½ set · Schoenfeld et al. 2017 · ~10+ weekly sets per muscle for growth')])));

  // ── Gaps ──
  body.appendChild(card('GAPS',null,r.gaps.length?r.gaps.map(g=>h('div',{style:'display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.45'},[
    h('span',{style:`flex-shrink:0;width:8px;height:8px;border-radius:4px;margin-top:6px;background:${g.sev==='bad'?T.bad:T.warn}`}),
    h('span',null,g.text),
  ])):[h('div',{style:`font-size:12px;color:${T.ok}`},'No gaps — nicely balanced training.')]));

  // ── Focus next ──
  body.appendChild(h('div',{style:`background:${T.acc};color:${T.bg};border-radius:14px;padding:16px 18px`},[
    h('div',{style:'font-size:10px;letter-spacing:2.5px;opacity:.6;font-weight:600;margin-bottom:10px'},'FOCUS NEXT'),
  ].concat(r.focus.map((f,i)=>h('div',{style:'display:flex;gap:12px;padding:6px 0;font-size:13px;line-height:1.5'},[
    h('span',{style:'font-family:var(--mono);font-weight:600;font-size:13px;opacity:.5'},String(i+1)),
    h('span',null,f),
  ])))));
  return wrap;
}

// Single global mouse-drag handler — cards register themselves on mousedown,
// so re-renders no longer pile up stale window listeners.
let activeDrag=null;
window.addEventListener('mousemove',e=>{
  if(!activeDrag)return;
  const dx=e.clientX-activeDrag.startX;
  activeDrag.setX(Math.max(-82,Math.min(0,activeDrag.startOff+dx)),false);
});
window.addEventListener('mouseup',()=>{
  if(!activeDrag)return;
  const d=activeDrag; activeDrag=null; d.snap();
});
function attachSwipe(container,inner,id){
  const W=82,TH=46; let startX=0,startOff=0,offset=0;
  const isOpen=()=>state.histOpen===id;
  if(isOpen()){ inner.style.transform='translateX(-'+W+'px)'; offset=-W; }
  const setX=(x,anim)=>{ inner.style.transition=anim?'transform .22s cubic-bezier(.25,1,.5,1)':'none'; inner.style.transform='translateX('+x+'px)'; offset=x; };
  const snap=()=>{ if(offset<-TH){setX(-W,true);state.histOpen=id;} else {setX(0,true);if(isOpen())state.histOpen=null;} };
  // Lock to one axis after the first few px so vertical scrolling never slides the card
  let startY=0,axis=null;
  container.style.touchAction='pan-y';
  container.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;axis=null;startOff=isOpen()?-W:0;inner.style.transition='none';},{passive:true});
  container.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
    if(!axis){ if(Math.abs(dx)<8&&Math.abs(dy)<8)return; axis=Math.abs(dx)>Math.abs(dy)?'x':'y'; }
    if(axis==='x') setX(Math.max(-W,Math.min(0,startOff+dx)),false);
  },{passive:true});
  container.addEventListener('touchend',()=>{ if(axis==='x')snap(); });
  container.addEventListener('mousedown',e=>{ activeDrag={startX:e.clientX,startOff:isOpen()?-W:0,setX,snap}; inner.style.transition='none'; });
}

function deleteWorkout(idx){
  state.undo={w:state.saved[idx],idx};
  state.saved=state.saved.filter((_,i)=>i!==idx);
  state.histOpen=null; state.histExp=null; persist();
  showToast('ok','Workout deleted',true);
}
function undoDelete(){
  if(!state.undo)return;
  state.saved.splice(Math.min(state.undo.idx,state.saved.length),0,state.undo.w);
  state.undo=null; state.toast=null; persist(); render();
}
let toastSeq=0;
function showToast(type,text,undo){
  const id=++toastSeq;
  state.toast={id,type,text,undo:!!undo}; render();
  setTimeout(()=>{
    if(state.toast&&state.toast.id===id){
      state.toast=null; if(undo)state.undo=null;
      if(state.screen==='history')render();
    }
  },undo?6000:3500);
}
function csvCell(v){ v=(v==null?'':String(v)); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cell);cell='';} else if(c==='\n'){row.push(cell);cell='';rows.push(row);row=[];} else if(c==='\r'){} else cell+=c; }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>!(r.length===1&&r[0]===''));
}
function handleExport(){
  if(!state.saved.length){ showToast('err','No workouts to export'); return; }
  const header=['workout_id','date','target','duration_min','elapsed_sec','exercise_id','exercise_name','set_number','weight_lbs','reps','rpe'];
  const rows=[header];
  state.saved.forEach(w=>{
    const wid=w.id||'', date=w.date||'', tgt=w.config?w.config.target:'', dur=w.config?w.config.dur:'', el=w.elapsed||0;
    (w.exercises||[]).forEach(ex=>{
      if(ex.loggedSets&&ex.loggedSets.length){
        ex.loggedSets.forEach((s,i)=>rows.push([wid,date,tgt,dur,el,ex.id,ex.name,i+1,s.weight,s.reps,s.rpe||'']));
      } else {
        rows.push([wid,date,tgt,dur,el,ex.id,ex.name,'','','','']);
      }
    });
  });
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const name='forge-backup-'+new Date().toISOString().slice(0,10)+'.csv';
  const done=()=>{ markBackedUp(); showToast('ok','Exported '+state.saved.length+' workout'+(state.saved.length>1?'s':'')); };
  // iPhone: share sheet → "Save to Files" / AirDrop / email; elsewhere: plain download
  try{
    const file=new File([csv],name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'FORGE backup'}).then(done).catch(()=>{});
      return;
    }
  }catch(e){}
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})), a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  done();
}
// Backup reminder bookkeeping: when, and how many workouts existed at the time
const BACKUP_KEY='forge_backup_v1';
function markBackedUp(){ try{ localStorage.setItem(BACKUP_KEY,JSON.stringify({at:Date.now(),count:state.saved.length})); }catch(e){} }
function backupDue(){
  if(state.saved.length<3) return null;
  let b=null; try{ b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null'); }catch(e){}
  const since=state.saved.length-(b?b.count:0), days=b?(Date.now()-b.at)/DAY:Infinity;
  return since>=5||(since>0&&days>=14)?{since,never:!b}:null;
}
function handleImportFile(e){
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const rows=parseCSV(ev.target.result);
      if(rows.length<2) throw new Error('No rows found');
      const head=rows[0].map(s=>s.trim().toLowerCase());
      const ci=name=>head.indexOf(name);
      const need=['workout_id','date','exercise_id'];
      if(need.some(n=>ci(n)<0)) throw new Error('Missing required columns');
      const cW=ci('workout_id'),cD=ci('date'),cT=ci('target'),cDur=ci('duration_min'),cEl=ci('elapsed_sec'),cEi=ci('exercise_id'),cEn=ci('exercise_name'),cSn=ci('set_number'),cWt=ci('weight_lbs'),cR=ci('reps'),cRpe=ci('rpe');
      const byW=new Map();
      rows.slice(1).forEach(r=>{
        const wid=r[cW]; if(wid==null||wid==='')return;
        if(!byW.has(wid)){
          byW.set(wid,{id:(/^\d+$/.test(wid)?Number(wid):wid),date:r[cD]||new Date().toISOString(),config:{dur:Number(r[cDur])||60,target:r[cT]||'upper'},elapsed:Number(r[cEl])||0,exMap:new Map()});
        }
        const w=byW.get(wid), exId=r[cEi], exName=cEn>=0?r[cEn]:'';
        if(!exId)return;
        if(!w.exMap.has(exId)){
          const def=getExDef({id:exId});
          w.exMap.set(exId,Object.assign({},def,{id:exId,name:exName||def.name||exId,pSets:def.sets||3,pReps:def.reps||8,loggedSets:[]}));
        }
        const sn=cSn>=0?r[cSn]:'', rep=cR>=0?r[cR]:'';
        if(sn!==''&&rep!==''){ w.exMap.get(exId).loggedSets.push(Object.assign({weight:parseFloat(r[cWt])||0,reps:parseInt(rep)||0,ts:Date.now()},cRpe>=0&&parseFloat(r[cRpe])?{rpe:parseFloat(r[cRpe])}:{})); }
      });
      const valid=Array.from(byW.values()).map(w=>({id:w.id,date:w.date,config:w.config,elapsed:w.elapsed,exercises:Array.from(w.exMap.values())}));
      if(!valid.length) throw new Error('No valid workouts found');
      const byId=new Map();
      state.saved.concat(valid).forEach(w=>{const k=w.id||JSON.stringify(w.date);byId.set(k,w);});
      state.saved=Array.from(byId.values()).sort((a,b)=>new Date(a.date)-new Date(b.date));
      persist();
      showToast('ok','Imported '+valid.length+' workout'+(valid.length>1?'s':''));
    }catch(err){ showToast('err','Import failed: '+err.message); }
  };
  reader.readAsText(file); e.target.value='';
}

// ═══ BOOT ═══
render();
// Offline: cache the app so it opens with no signal. Ask the browser not to evict our data.
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

</script>
